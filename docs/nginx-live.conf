# Merge the rtmp block at nginx's top level, beside the existing http block.
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # OBS performs the H.264/AAC encoding. Nginx only packages it as HLS.
            hls on;
            hls_path /var/www/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_cleanup on;
            hls_continuous off;

            on_publish http://127.0.0.1:8080/internal/rtmp/publish;
            on_publish_done http://127.0.0.1:8080/internal/rtmp/publish-done;

            allow publish all;
            deny play all;
        }
    }
}

# Merge these locations into the HTTPS server block for the public hostname.
#
# The regex accepts the playlist:
#   /hls/<32-character-stream-id>.m3u8
# and its media fragments:
#   /hls/<32-character-stream-id>-123.ts
location ~ "^/hls/(?<stream_id>[a-f0-9]{32})(?:[.-].*)$" {
    set $authorized_stream $stream_id;
    auth_request /_live_auth;

    root /var/www;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff";
}

location = /_live_auth {
    internal;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_pass http://127.0.0.1:8080/internal/live/authorize?stream=$authorized_stream;
}

# The Rust application, including /watch/... and /assets/...
location ^~ /internal/ {
    deny all;
}

location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:8080;
}
